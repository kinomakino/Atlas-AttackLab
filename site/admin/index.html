<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Atlas-AttackLab</title>
<link rel="icon" href="/assets/brand/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-header">
<nav class="wrap" aria-label="Admin">
<a class="brand" href="/admin/"><img src="/assets/brand/marca-96.png" width="34" height="34" alt="">
<span>Atlas-AttackLab<small>Administración</small></span></a>
<div class="nav-links">
<span class="muted" id="who"></span>
<a href="/">Ver la web</a>
<a href="/.auth/logout?post_logout_redirect_uri=/">Salir</a>
</div>
</nav>
</header>

<main class="wrap">
<section style="padding-bottom: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div style="flex: 1 1 300px">
<h1 style="font-size: 40px; margin: 0">Catálogo de retos</h1>
<p class="muted" style="margin: 6px 0 0">Lo publicado aparece en la matriz pública y lo verá la herramienta local.</p>
</div>
<button class="btn btn-attack" type="button" id="new">Nuevo reto</button>
</div>
</section>

<div style="overflow-x: auto; border: 1px solid var(--line); border-radius: 14px">
<table class="list">
<thead><tr><th scope="col">Reto</th><th scope="col">ATLAS</th><th scope="col">Nivel</th><th scope="col">Tipo</th><th scope="col">Versión</th><th scope="col">Estado</th><th scope="col"><span class="visually-hidden">Acciones</span></th></tr></thead>
<tbody id="rows"><tr><td colspan="7" class="muted">Cargando…</td></tr></tbody>
</table>
</div>

<section>
<form class="card form" id="form" hidden>
<h2 class="full" style="margin: 0; font-size: 24px" id="form-title">Nuevo reto</h2>
<label>Identificador
<input name="id" required pattern="[a-z0-9][a-z0-9-]{2,62}" placeholder="aml-t0051-secreto-asistente">
</label>
<label>Título
<input name="title" required maxlength="120">
</label>
<label>Técnicas ATLAS (separadas por comas)
<input name="atlas" required placeholder="AML.T0051.000, AML.T0056">
</label>
<label>Nivel
<select name="level"><option value="básico">básico</option><option value="intermedio">intermedio</option><option value="avanzado">avanzado</option></select>
</label>
<label>Tipo
<select name="tier"><option value="free">Gratis</option><option value="paid">Suscripción</option></select>
</label>
<label>Estado
<select name="status"><option value="draft">Borrador</option><option value="published">Publicado</option></select>
</label>
<label>Versión
<input name="version" required pattern="\d+\.\d+\.\d+" placeholder="0.1.0">
</label>
<label>Modelo que necesita
<input name="model" placeholder="llama3.2:3b">
</label>
<label class="full">Módulo (imagen OCI)
<input name="image" placeholder="ghcr.io/…/reto-aml-t0051:0.1.0">
</label>
<label class="full">Resumen
<textarea name="summary" maxlength="600"></textarea>
</label>
<div class="full actions">
<button class="btn btn-attack" type="submit">Guardar</button>
<button class="btn btn-ghost" type="button" id="cancel">Cancelar</button>
<span class="muted" id="msg" role="status"></span>
</div>
</form>
</section>
</main>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
